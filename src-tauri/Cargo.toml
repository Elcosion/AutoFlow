[package]
name = "autoflow"
version = "0.1.0"
description = "AutoFlow desktop shell and Rust core"
authors = ["AutoFlow contributors"]
edition = "2021"
default-run = "autoflow"

[lib]
name = "autoflow_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
default = []
# Tauri's production Windows build loads the embedded frontend through its
# custom protocol instead of depending on the Vite localhost server.
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
# AST and registered-function metadata are used for source-only API validation.
# Keep these `internals` structures pinned to the reviewed Rhai release.
rhai = { version = "=1.26.0", features = ["internals"] }
sha2 = "0.10"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg"] }
imageproc = { version = "0.27.0", default-features = false, features = ["rayon"] }

[target.'cfg(windows)'.dependencies]
windows-capture = "2.0.1"
windows = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_System_Registry",
    "Win32_System_ProcessStatus",
    "Win32_System_Threading",
    "Win32_System_StationsAndDesktops",
    "Win32_System_JobObjects",
    "Win32_Security",
    "Win32_Security_Cryptography",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_HiDpi",
    "Win32_UI_WindowsAndMessaging"
] }
