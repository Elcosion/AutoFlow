[package]
name = "autoflow"
version = "0.1.0"
description = "AutoFlow desktop shell and Rust core"
authors = ["AutoFlow contributors"]
edition = "2021"

[lib]
name = "autoflow_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
default = []
# Tauri's production Windows build loads the embedded frontend through its
# custom protocol instead of depending on the Vite localhost server.
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging"
] }
