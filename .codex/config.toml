# Codex: Sol root orchestrator + Luna routine agents + Astra review

# Root / orchestrator
model = "gpt-5.6-sol"
model_provider = "openai"
model_reasoning_effort = "high"

# Safe interactive defaults. Change if your workflow needs otherwise.
approval_policy = "on-request"
sandbox_mode = "danger-full-access"

[agents]
enabled = true

# Number of child agent threads Codex may keep open concurrently.
max_concurrent_threads_per_session = 4

# Unnamed agents use the Luna high execution tier.
default_subagent_model = "gpt-5.6-luna"
default_subagent_reasoning_effort = "high"
